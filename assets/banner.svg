<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="50%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <linearGradient id="cyberGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #a5b4fc;
      letter-spacing: 0.5px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #94a3b8;
    }
    .badge-bg {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 1.5;
      rx: 8px;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }

    /* Dynamic / Animated network flow particles in background */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }

    @keyframes dashStream {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-12px) translateX(10px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }

    .pulse-bg {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }

    .stream-line {
      stroke-dasharray: 10, 15;
      animation: dashStream 8s linear infinite;
    }

    .stream-line-rev {
      stroke-dasharray: 8, 12;
      animation: dashStream 6s linear infinite reverse;
    }

    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 3s; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Mesh Grids & Ambient Lights -->
  <g class="pulse-bg">
    <circle cx="150" cy="80" r="180" fill="#ff5722" opacity="0.12" filter="url(#glow)" />
    <circle cx="1050" cy="280" r="220" fill="#00e5ff" opacity="0.12" filter="url(#glow)" />
    <circle cx="950" cy="70" r="140" fill="#6366f1" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Subtle Network Graph Lines in Background (Kept Behind Text) -->
  <g stroke="#334155" stroke-width="1.2" opacity="0.35">
    <!-- Grid elements -->
    <line x1="80" y1="40" x2="1120" y2="40" />
    <line x1="80" y1="320" x2="1120" y2="320" />
    <line x1="80" y1="40" x2="80" y2="320" />
    <line x1="1120" y1="40" x2="1120" y2="320" />
  </g>

  <!-- Network Circuit & Packet Flow Lines (Visual Background) -->
  <g opacity="0.6">
    <path class="stream-line" d="M 60 180 Q 300 80 600 180 T 1140 180" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
    <path class="stream-line-rev" d="M 60 220 Q 350 310 700 220 T 1140 140" fill="none" stroke="#00e5ff" stroke-width="1.8" opacity="0.7" />
    <path class="stream-line" d="M 120 70 L 260 70 L 340 150 L 520 150" fill="none" stroke="#ff5722" stroke-width="1.5" opacity="0.5" />
    <path class="stream-line-rev" d="M 750 290 L 880 290 L 960 210 L 1100 210" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Dynamic Animated Packets / Floating Nodes -->
  <g>
    <circle class="particle-1" cx="240" cy="140" r="4.5" fill="#ff9800" filter="url(#softGlow)" />
    <circle class="particle-2" cx="500" cy="190" r="5" fill="#00e5ff" filter="url(#softGlow)" />
    <circle class="particle-3" cx="820" cy="120" r="4.5" fill="#f43f5e" filter="url(#softGlow)" />
    <circle class="particle-1" cx="1020" cy="230" r="5.5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle class="particle-2" cx="140" cy="270" r="4" fill="#a855f7" filter="url(#softGlow)" />
  </g>

  <!-- Foreground Backdrop Plate for Text Readability -->
  <rect x="70" y="55" width="1060" height="250" rx="14" fill="#0b1120" fill-opacity="0.82" stroke="#1e293b" stroke-width="1.5" />

  <!-- Rust Gear & Speed Vector Icon (Left Decor) -->
  <g transform="translate(105, 95)">
    <circle cx="36" cy="36" r="34" fill="#ff5722" fill-opacity="0.15" stroke="#ff5722" stroke-width="2" />
    <path d="M 36 12 L 36 22 M 36 50 L 36 60 M 12 36 L 22 36 M 50 36 L 60 36 M 19 19 L 26 26 M 46 46 L 53 53 M 19 53 L 26 46 M 46 26 L 53 19" stroke="#ff9800" stroke-width="3" stroke-linecap="round" />
    <circle cx="36" cy="36" r="14" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <polygon points="32,28 44,36 32,44" fill="#00e5ff" />
  </g>

  <!-- Main Titles (Always Cleanly in Foreground) -->
  <g transform="translate(195, 115)">
    <text class="title-text" x="0" y="0">
      Awesome <tspan fill="url(#accentGrad)">Systems Networking</tspan> &amp; Rust
    </text>
    <text class="subtitle-text" x="0" y="36">
      High-Performance Rust • Zero-Trust Mesh VPNs • eBPF • Async Sockets • Edge Proxies
    </text>
    <text class="tagline-text" x="0" y="66">
      Curated index of benchmark-grade networking platforms, low-latency runtimes, and packet telemetry
    </text>
  </g>

  <!-- Interactive/Ecosystem Pill Badges (Foreground Bottom) -->
  <g transform="translate(195, 225)">
    <!-- Pill 1 -->
    <rect class="badge-bg" x="0" y="0" width="135" height="34" />
    <text class="badge-text" x="14" y="22">⚡ Tokio &amp; Quinn</text>

    <!-- Pill 2 -->
    <rect class="badge-bg" x="147" y="0" width="145" height="34" />
    <text class="badge-text" x="161" y="22">🔒 WireGuard Mesh</text>

    <!-- Pill 3 -->
    <rect class="badge-bg" x="304" y="0" width="135" height="34" />
    <text class="badge-text" x="318" y="22">🐝 eBPF &amp; Aya</text>

    <!-- Pill 4 -->
    <rect class="badge-bg" x="451" y="0" width="155" height="34" />
    <text class="badge-text" x="465" y="22">🛡️ Zero-Trust SASE</text>

    <!-- Pill 5 -->
    <rect class="badge-bg" x="618" y="0" width="170" height="34" />
    <text class="badge-text" x="632" y="22">🌐 Pingora &amp; Reverse Proxies</text>
  </g>
</svg>
